<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archetypen Leerpret</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #eef2f7; }
        .card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 0.5rem; }
        p { color: #7f8c8d; margin-bottom: 1.5rem; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2ecc71; }
        #status { font-size: 0.9rem; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Leerpret App</h1>
        <p id="status">Controleer toegang...</p>
        
        <div id="app-content" style="display:none;">
            <label for="archetype">Kies een Archetype:</label>
            <select id="archetype">
                <option value="Veroveraar">Veroveraar</option>
                <option value="Verwerver">Verwerver</option>
                <option value="Verkenner">Verkenner</option>
                <option value="Volger">Volger</option>
                <option value="Verlater">Verlater</option>
            </select>
            <button onclick="verstuurData()">Gegevens Opslaan</button>
        </div>
    </div>

    <script>
        // Haal de hash uit de URL (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const userHash = urlParams.get('id');

        // Toegangscontrole
        if (userHash) {
            document.getElementById('status').innerText = "Toegang verleend (ID: " + userHash + ")";
            document.getElementById('status').style.color = "#27ae60";
            document.getElementById('app-content').style.display = "block";
        } else {
            document.getElementById('status').innerText = "❌ Geen geldige toegangscode.";
            document.getElementById('status').style.color = "#e74c3c";
        }

        async function verstuurData() {
            const archetype = document.getElementById('archetype').value;
            const statusText = document.getElementById('status');

            // De specifieke Google Form ID's die we net hebben opgehaald
            const formID = "1FAIpQLSfW7ql1je-E_FRJkIpQZKXckNM7RG3oBy3mj6hE5Va9DGwkEA";
            const entryID_Sleutel = "entry.233683089";
            const entryID_Data = "entry.40201663";

            const url = `https://docs.google.com/forms/d/e/${formID}/formResponse?${entryID_Sleutel}=${userHash}&${entryID_Data}=${archetype}&submit=Submit`;

            statusText.innerText = "Bezig met opslaan...";

            try {
                await fetch(url, { mode: 'no-cors' });
                statusText.innerText = "✅ Succesvol verzonden naar Google!";
                statusText.style.color = "#27ae60";
            } catch (error) {
                statusText.innerText = "❌ Fout bij verzenden. Probeer opnieuw.";
                statusText.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
